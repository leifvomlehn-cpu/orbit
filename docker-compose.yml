# Orbital Simulation System - Synology DS918+ Optimized
# Backend: Port 5556 | Frontend: Port 5557
# v1.1.0 - cleaned dependency stack, production-ready (no dev mount)

services:
  backend:
    build:
      context: ./backend
    container_name: orbital-backend
    restart: unless-stopped
    ports:
      - "5556:5000"
    volumes:
      - orbital-data:/app/data
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - orbital-network

  frontend:
    build:
      context: ./frontend
    container_name: orbital-frontend
    restart: unless-stopped
    ports:
      - "5557:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - orbital-network

volumes:
  orbital-data:
    driver: local

networks:
  orbital-network:
    driver: bridge
