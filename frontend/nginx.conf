# Nginx configuration for Orbital Simulator Frontend
# v1.1.1 - deploy-sicheres Caching: HTML no-cache, JS/CSS nur 5 min
# (1d-Caching liess Browser nach Deploys bis zu 24h auf altem app.js)

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
    gzip_comp_level 6;

    # Vite-Assets tragen Content-Hashes im Dateinamen -> aggressiv cachen.
    # ^~ (Präfix) schlägt jede Regex-Location, greift also vor dem css|js-Block.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx-Vererbungsfalle: eigener add_header im Block deaktiviert die
        # Server-Level-Header -> Security-Header hier explizit wiederholen.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    }

    location ~* \.(css|js)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        # nginx-Vererbungsfalle: eigener add_header im Block deaktiviert die
        # Server-Level-Header -> Security-Header hier explizit wiederholen.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        # nginx-Vererbungsfalle: eigener add_header im Block deaktiviert die
        # Server-Level-Header -> Security-Header hier explizit wiederholen.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sprint A.3.1: lange N-Body-Sims (100k Jahre, N=11) brauchen
        # auf DS918+ Celeron deutlich mehr als 60s.
        # Staffelung gegen 502-Race: gunicorn --timeout 600s muss ZUERST
        # schiessen — read 570s hier, sonst gibt nginx auf, kurz bevor
        # gunicorn den Worker sauber killt. connect ist lokal: 10s reicht.
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 570s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # HTML immer revalidieren (no-cache = ETag/304, billig), sonst zeigt
        # ein gecachtes index.html nach Deploys auf ein veraltetes Bundle.
        # ACHTUNG nginx-Vererbung: ein location-Block mit eigenem add_header
        # erbt KEINE add_header vom server-Level -> Security-Header hier
        # explizit wiederholen, sonst fehlen sie auf allen HTML-Seiten.
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
